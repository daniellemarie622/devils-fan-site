name: Refresh New Jersey Devils data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_devils.py"
      - "requirements.txt"
      - ".github/workflows/update-devils.yml"

permissions:
  contents: write

concurrency:
  group: devils-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install -r requirements.txt

      - name: Retrieve current NHL roster, stats, standings and official news
        run: python update_devils.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/devils.json data/roster-previous.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Devils roster, stats and news"
            git push
          else
            echo "No data changes to commit."
          fi
